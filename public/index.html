<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
/* Minimal reset equivalent to the claude.ai artifact skeleton */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<!--
  BIG BOARD FY27 — Netlify build.
  Shared state goes through window.claude.use("db"/"user"), supplied here by
  /store.js: a thin adapter over the /api/* Netlify Function, which keeps every
  document in Netlify Blobs behind a password login.
-->
<title>BIG BOARD FY27</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#FF6600">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: orange masthead with the month strip; base tabs beneath; one scrolling board per base,
   grouped by source, each initiative a row with the month's update beside its definition. */
:root{
  /* easyJet palette: primary orange, secondary (dark orange / extra light orange / sky blue / grey), tertiary (sea blue / terracotta / green), with 40% tints */
  --orange:#FF6600; --orange-80:#FF874A; --orange-40:#FFC299; --orange-soft:#FFF0E5;
  --dark-orange:#FF4600; --dark-orange-40:#FFB599;
  --xlight-orange:#FFAA00; --xlight-orange-40:#FFDD99;
  --sky:#0AB0A5; --sky-40:#9DDBD3; --sky-10:#E6F6F4;
  --grey:#696D6F; --grey-40:#A4A4A2; --grey-10:#F0F0EF;
  --sea:#45DBEF; --sea-40:#B0EBF4; --sea-10:#EAF9FC;
  --terracotta:#FF9275; --terracotta-40:#F9CDC2; --terracotta-10:#FFF0EC;
  --ej-green:#42C620; --ej-green-40:#ADE1A0; --ej-green-10:#EEF8EA;
  --bg:#F7F7F6; --surface:#FFFFFF; --surface-2:#F4F4F3; --line:#E3E3E1; --line-strong:#C8C8C5;
  --fg:#1E1E1E; --muted:#696D6F; --faint:#A4A4A2;
  /* RAG mapped onto brand */
  --green:#2E9A12; --green-bg:var(--ej-green-40); --green-soft:var(--ej-green-10);
  --amber:#B87400; --amber-bg:var(--xlight-orange-40); --amber-soft:#FFF5DD;
  --red:#D63A00; --red-bg:var(--dark-orange-40); --red-soft:#FFEDE5;
  --blue:#07857C; --blue-bg:var(--sky-40); --blue-soft:var(--sky-10);
  --none-bg:var(--grey-10); --none-fg:var(--grey);
  --shadow:0 1px 2px rgba(30,30,30,.05),0 6px 20px rgba(30,30,30,.06);
  --display:"Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Nunito",Verdana,"Trebuchet MS",sans-serif;
  --radius:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --orange-soft:#3A2414; --sky-10:#12302D; --grey-10:#2B2B2A; --sea-10:#10303A; --terracotta-10:#3A2420; --ej-green-10:#1B3014;
  --bg:#171716; --surface:#212120; --surface-2:#2A2A28; --line:#383836; --line-strong:#4C4C49;
  --fg:#F1F1EE; --muted:#B4B6B6; --faint:#7F8283;
  --green:#7EDB62; --green-bg:#24461A; --green-soft:#1B3014;
  --amber:#FFC247; --amber-bg:#4A3810; --amber-soft:#332810;
  --red:#FF8A66; --red-bg:#4C2213; --red-soft:#33190F;
  --blue:#4FD4C9; --blue-bg:#124A45; --blue-soft:#12302D;
  --none-bg:#2E2E2D; --none-fg:#A4A4A2;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --orange-soft:#3A2414; --sky-10:#12302D; --grey-10:#2B2B2A; --sea-10:#10303A; --terracotta-10:#3A2420; --ej-green-10:#1B3014;
  --bg:#171716; --surface:#212120; --surface-2:#2A2A28; --line:#383836; --line-strong:#4C4C49;
  --fg:#F1F1EE; --muted:#B4B6B6; --faint:#7F8283;
  --green:#7EDB62; --green-bg:#24461A; --green-soft:#1B3014;
  --amber:#FFC247; --amber-bg:#4A3810; --amber-soft:#332810;
  --red:#FF8A66; --red-bg:#4C2213; --red-soft:#33190F;
  --blue:#4FD4C9; --blue-bg:#124A45; --blue-soft:#12302D;
  --none-bg:#2E2E2D; --none-fg:#A4A4A2;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--orange)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* masthead */
.mast{background:var(--orange);color:#fff}
.mast .inner{display:flex;align-items:center;gap:10px 20px;padding-block:10px;max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;flex:0 0 auto}
.brand h1{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.5px;text-transform:uppercase;margin:0;line-height:1;white-space:nowrap}
.brand .fy{font-family:var(--display);font-weight:500;font-size:13px;text-transform:uppercase;letter-spacing:1.2px;opacity:.85;white-space:nowrap}
.months{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:0 -2px;flex:1 1 auto;min-width:0}
#acct{flex:0 0 auto;margin-left:auto}
@media(max-width:900px){.mast .inner{flex-wrap:wrap}.months{order:3;flex-basis:100%}}
@media(max-width:520px){.brand .fy{display:none}}
.acct{position:relative;z-index:40}
.acct summary{list-style:none;cursor:pointer;background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:4px 12px;font-weight:700;font-size:12.5px;white-space:nowrap}
.acct summary::-webkit-details-marker{display:none}
.acct summary:hover{background:rgba(255,255,255,.28)}
.pop{position:relative;display:inline-block}
.pop>summary{list-style:none}
.pop>summary::-webkit-details-marker{display:none}
.pop[open]>summary{border-color:var(--grey)}
.acct .menu,.pop .menu{position:absolute;z-index:15;right:0;top:calc(100% + 6px);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:190px;padding:6px;display:flex;flex-direction:column}
.acct .menu .who{padding:6px 10px 8px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.acct .menu a,.acct .menu button,.pop .menu button{display:block;text-align:left;padding:7px 10px;border-radius:6px;color:var(--fg);text-decoration:none;background:none;border:0;font-size:13px;font-weight:600}
.acct .menu a:hover,.acct .menu button:hover,.pop .menu button:hover{background:var(--surface-2)}
.months::-webkit-scrollbar{display:none}
.mbtn{flex:0 0 auto;border:0;border-radius:999px;padding:4px 10px;background:rgba(255,255,255,.14);color:#fff;font-weight:600;font-size:13px;white-space:nowrap;position:relative}
.mbtn:hover{background:rgba(255,255,255,.26)}
.mbtn.on{background:#fff;color:var(--dark-orange)}
.mbtn.prior{opacity:.75}
.mbtn .dot{position:absolute;top:3px;right:6px;width:6px;height:6px;border-radius:50%;background:#fff}
.mbtn.on .dot{background:var(--orange)}
.mbtn.future{opacity:.5}

/* base nav */
.nav{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.nav .inner{display:flex;gap:2px;overflow-x:auto;max-width:1400px;margin:0 auto;scrollbar-width:none}
.nav .inner::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:none;padding:12px 14px 10px;font-family:var(--display);font-weight:500;font-size:15px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-bottom-color:var(--orange)}
.tab .cnt{font-family:var(--body);font-size:11px;font-weight:700;background:var(--surface-2);color:var(--muted);border-radius:999px;padding:1px 7px;letter-spacing:0}
.tab .cnt.hot{background:var(--red-soft);color:var(--red)}
.tab .cnt.done{background:var(--ej-green-40);color:var(--green)}
.tab.sep{margin-left:auto}

main{max-width:1400px;margin:0 auto;padding-block:20px 60px}
.banner{background:var(--orange-soft);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;font-size:13px;color:var(--muted);margin-bottom:16px}
.banner strong{color:var(--fg)}
.hidden{display:none!important}

/* section heads */
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px;margin-bottom:22px}
.phead h2{font-family:var(--display);font-weight:600;font-size:26px;text-transform:uppercase;letter-spacing:.5px;margin:0;line-height:1;text-wrap:balance}
.phead h2 small{font-family:var(--body);font-weight:600;font-size:13px;text-transform:none;letter-spacing:0;color:var(--muted);display:block;margin-top:6px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px;color:var(--fg)}
.btn:hover{border-color:var(--grey)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.primary:hover{background:var(--dark-orange)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:default}

/* network grid */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.green{background:var(--green-bg);color:var(--green)}
.chip.amber{background:var(--amber-bg);color:var(--amber)}
.chip.red{background:var(--red-bg);color:var(--red)}
.chip.blue{background:var(--blue-bg);color:var(--blue)}
.chip.grey{background:var(--grey-10);color:var(--grey)}
.chip.none{background:var(--none-bg);color:var(--none-fg)}
.chip.board{background:var(--orange);color:#fff}
.chip.board::before{display:none}
.chip.warn{background:var(--red-soft);color:var(--red)}
.chip.ok{background:var(--green-soft);color:var(--green)}
.net2{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:16px;align-items:start}
@media(max-width:900px){.net2{grid-template-columns:1fr}}
.card h3{font-family:var(--body);font-weight:800;font-size:15px;margin:0 0 12px;color:var(--fg);display:flex;align-items:center;gap:8px}
.card h3 .n{font-weight:700;font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:1px 8px}

/* board (base view) */
.group{margin-bottom:22px}
.ghead{font-family:var(--body);font-weight:800;font-size:13px;color:var(--muted);padding:0 2px 6px;border-bottom:1px solid var(--line-strong);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.def{min-width:0}
.def .fa{font-family:var(--display);font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.4px;line-height:1.2;margin:0 0 4px;color:var(--fg)}
.def .dt{font-size:13px;color:var(--muted);white-space:pre-line;margin:0 0 10px}
.def .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12.5px;margin:0}
.def .dt+.kv{padding-top:8px;border-top:1px solid var(--line)}
.def .kv div{display:contents}
.def .kv dt{font-weight:700;font-size:12px;color:var(--faint);white-space:nowrap}
.def .kv dd{margin:0;white-space:pre-line;color:var(--fg);font-variant-numeric:tabular-nums}
.upd{min-width:0;display:flex;flex-direction:column;gap:12px}
.upd .uhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:26px}
.upd .uhead .when{font-size:12px;color:var(--faint);margin-left:auto}
.upd .text{white-space:pre-wrap;font-size:13.5px;line-height:1.55;margin:0}
.upd .text.empty{color:var(--faint);font-style:italic}
.ft{font-size:14px;line-height:1.55;display:flex;flex-direction:column;gap:4px;margin:0;max-width:78ch}
.ft .h{font-family:var(--body);font-weight:800;font-size:11.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);margin-top:10px;display:inline-block;align-self:flex-start}
.ft .h:first-child{margin-top:0}
.ft .h.done{color:var(--green)}
.ft .h.next{color:var(--amber)}
.ft .h.issue{color:var(--red)}
.ft .b{display:flex;gap:7px;margin:0}
.ft .b::before{content:"";flex:0 0 5px;height:5px;border-radius:50%;background:var(--faint);margin-top:9px}
.ft .b.l2{padding-left:16px}
.ft .b.l2::before{background:var(--grey-40);width:5px;height:5px;flex-basis:5px}
.ft .p{margin:0;white-space:pre-wrap}
details.prev .ft{color:var(--muted);margin-top:6px;border-left:2px solid var(--sea-40);padding-left:10px}
details.prev .ft .h{color:var(--muted);border-color:var(--line)}
.upd .barrier{background:var(--orange-soft);border-left:3px solid var(--orange);border-radius:0 8px 8px 0;padding:8px 10px;font-size:13px}
.upd .barrier b{font-weight:800;font-size:12px;color:var(--dark-orange);display:block;margin-bottom:2px}
.upd .ufoot{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.upd .ufoot .when{font-size:12px;color:var(--faint)}
details.prev{font-size:13px}
details.prev summary{cursor:pointer;color:var(--muted);font-weight:700;font-size:12px;list-style:none;display:inline-flex;align-items:center;gap:6px}
details.prev summary::before{content:"▸";font-size:11px;transition:transform .15s}
details.prev[open] summary::before{transform:rotate(90deg)}
details.prev .text{color:var(--muted);margin-top:6px;border-left:2px solid var(--line);padding-left:10px}
.clamp{max-height:11em;overflow:hidden;position:relative}
.clamp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2.5em;background:linear-gradient(to bottom,transparent,var(--surface))}
.more{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-weight:700;font-size:12px;padding:0;align-self:flex-start}


/* network dashboard */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:18px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpi{background:var(--surface);padding:14px 16px}
.kpi .v{font-family:var(--display);font-weight:600;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .v small{font-family:var(--body);font-size:14px;font-weight:700;color:var(--faint);margin-left:2px}
.kpi .l{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:6px}
.kpi.bad .v{color:var(--red)}.kpi.warn .v{color:var(--amber)}.kpi.hot .v{color:var(--orange)}
.card.flush{padding:0;overflow:hidden}
.ntable{min-width:760px}
.ntable th,.ntable td{padding:12px 14px;vertical-align:middle}
.ntable th.c,.ntable td.c{text-align:center}
.ntable tr.link{cursor:pointer}
.ntable tr.link:hover td{background:var(--surface-2)}
.ntable .bcode{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.6px}
.ntable .bname{color:var(--muted);font-size:13px;margin-left:6px}
@media(max-width:600px){.ntable .bname{display:none}}
.ntable b{font-size:15px;font-variant-numeric:tabular-nums}
.ntable .of{color:var(--faint);font-weight:700}
.ntable .miss{font-size:11.5px;font-weight:700;color:var(--amber)}
.zero{color:var(--faint)}
.t-green{color:var(--green)}.t-amber{color:var(--amber)}.t-red{color:var(--red)}.t-blue{color:var(--blue)}
.ntable .chip.board{cursor:pointer}

/* base tracker */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{border:0;background:none;border-radius:8px;padding:5px 11px;font-weight:700;font-size:12.5px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.seg button span{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.seg button:hover:not([disabled]){color:var(--fg)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.seg button.on span{color:var(--orange)}
.seg button[disabled]{opacity:.45;cursor:default}
.toolbar input[type=search]{flex:1 1 220px;max-width:340px;width:auto;padding:7px 12px;border-radius:10px}
.toolbar .btn.ghost{margin-left:auto}
.ilist{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.it-head,.it-row{display:grid;grid-template-columns:118px minmax(0,2.2fr) minmax(0,1.3fr) minmax(0,3fr) 64px 18px;gap:14px;align-items:center;padding:0 16px}
.it-head{font-size:12px;font-weight:700;color:var(--muted);padding-block:9px;border-bottom:1px solid var(--line-strong);background:var(--surface-2)}
.grp-h{display:flex;align-items:center;gap:8px;width:100%;border:0;background:var(--surface);text-align:left;padding:14px 16px 6px;font-weight:800;font-size:12.5px;color:var(--muted)}
.grp-h .n{font-weight:700;color:var(--faint)}
.grp-h .caret{font-size:10px;transition:transform .15s}
.grp.shut .grp-h{padding-bottom:12px;border-bottom:1px solid var(--line)}
.grp.shut .grp-h .caret{transform:rotate(-90deg)}
.it{border-bottom:1px solid var(--line);position:relative}
.grp:last-child .it:last-child{border-bottom:0}
.it::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.it.rag-green::before{background:var(--ej-green)}.it.rag-amber::before{background:var(--xlight-orange)}.it.rag-red::before{background:var(--dark-orange)}.it.rag-blue::before{background:var(--sky)}
.it-row{min-height:52px;padding-block:9px;cursor:pointer}
.it-row:hover{background:var(--surface-2)}
.it.open>.it-row{background:var(--surface-2)}
.c-ti .ti{font-weight:800;font-size:13.5px;line-height:1.3}
.c-ti .ti .chip{vertical-align:1px;margin-left:4px;padding:0 7px;font-size:10.5px}
.c-ti .sub,.c-kpi{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-up{font-size:13px;color:var(--fg);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.45}
.c-when{font-size:12px;color:var(--faint);text-align:right;white-space:nowrap}
.c-chev{color:var(--faint);font-size:18px;transition:transform .15s;text-align:center}
.it.open .c-chev{transform:rotate(90deg)}
.nostat{font-size:12px;font-weight:700;color:var(--faint)}
.nostat.missing{color:var(--amber)}
.it-body{display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,2.6fr);gap:28px;padding:16px 16px 20px 150px;background:var(--surface-2);border-top:1px solid var(--line)}
@media(max-width:900px){
  .it-head{display:none}
  .it-row{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"st ti ch" "up up up";row-gap:6px}
  .c-st{grid-area:st}.c-ti{grid-area:ti}.c-chev{grid-area:ch}.c-up{grid-area:up}.c-kpi,.c-when{display:none}
  .it-body{grid-template-columns:1fr;padding:14px 16px 18px;gap:16px}
  .toolbar .btn.ghost{margin-left:0}
}


/* month-on-month */
.kpi .d{display:block;font-size:11.5px;font-weight:700;margin-top:4px}
.d.bad{color:var(--red)}.d.good{color:var(--green)}.d.same{color:var(--faint)}
sup.d{font-size:10.5px;margin-left:3px;vertical-align:4px}
.tr{font-size:10px;margin-left:6px;vertical-align:1px}
.tr.down{color:var(--red)}.tr.up{color:var(--green)}

    --green:#2E9A12;--green-bg:#ADE1A0;--amber:#8a5700;--amber-bg:#FFDD99;--red:#C23400;--red-bg:#FFB599;--blue:#07857C;--blue-bg:#9DDBD3;--none-bg:#F0F0EF;--none-fg:#696D6F;--orange-soft:#FFF0E5}

<header class="mast gutter">
  <div class="inner">
    <div class="brand">
      <h1>BIG BOARD</h1>
      <span class="fy">FY27 · Focus initiatives</span>
    </div>
    <div class="months" id="months" role="tablist" aria-label="Month"></div>
    <div id="acct"></div>
  </div>
</header>
<nav class="nav gutter"><div class="inner" id="nav"></div></nav>

<main class="gutter" id="main">
  <div class="banner" id="banner" hidden></div>
  <div id="view"></div>
</main>

<div id="modalRoot"></div>
<div id="toast" class="toast" hidden></div>

<script src="/store.js"></script>
<script>
(() => {
'use strict';
// Bases live in the store (collection "bases"); BASES holds the active ones in display order.
let BASES = [];
let ALLBASES = [];
function setBases(list){ ALLBASES=list.slice().sort((a,b)=>(a.order||0)-(b.order||0)); BASES=ALLBASES.filter(b=>!b.archived); }
// FY27 runs 1 Oct 2026 – 30 Sep 2027. Sep '26 is kept as the FY26 close-out for continuity.
const MONTHS = [
  {k:'2026-09', l:"Sep '26", prior:true},
  {k:'2026-10', l:"Oct '26"},{k:'2026-11', l:"Nov '26"},{k:'2026-12', l:"Dec '26"},
  {k:'2027-01', l:"Jan '27"},{k:'2027-02', l:"Feb '27"},{k:'2027-03', l:"Mar '27"},
  {k:'2027-04', l:"Apr '27"},{k:'2027-05', l:"May '27"},{k:'2027-06', l:"Jun '27"},
  {k:'2027-07', l:"Jul '27"},{k:'2027-08', l:"Aug '27"},{k:'2027-09', l:"Sep '27"},
];
const RAG = {green:'On track', amber:'At risk', red:'Off track', blue:'Complete', '':'No status'};
const BSTATUS = {open:'Open', board:'With the board', resolved:'Resolved'};

const nowMonth = (() => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); })();
const S = {
  month: MONTHS.some(m=>m.k===nowMonth) ? nowMonth : '2026-10',
  view: 'network',
  inits: [], updates: {}, prevUpdates: {}, feedback: {}, barriers: [],
  db: null, user: null, uid: null, canWrite: null, names: {},
  unsub: {}, expanded: {}, open: {}, collapsed: {}, filter: 'all', q: '', etags: {}, series: {},
};

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mlabel = k => (MONTHS.find(m=>m.k===k)||{l:k}).l;
const prevKey = k => { const i=MONTHS.findIndex(m=>m.k===k); return i>0 ? MONTHS[i-1].k : null; };
const fmtStamp = iso => { const d=new Date(iso); return isNaN(d) ? '' : d.toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); };
const fmtWhen = iso => { if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); };
let toastT; const toast = m => { const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, 2200); };
const who = id => id ? (S.names[id] || 'Someone') : '';

/* ---------- data ---------- */
function initsFor(base){ return S.inits.filter(i=>i.base===base && !i.archived).sort((a,b)=>(a.order||0)-(b.order||0)); }
function upd(initId, month=S.month){ return (month===S.month ? S.updates : S.prevUpdates)[initId+'_'+month]; }
// month is S.month or the month before it (the two that are loaded).
function baseStats(base, month=S.month){
  const list = initsFor(base);
  const counts = {green:0,amber:0,red:0,blue:0,'':0}; let updated=0, needs=0;
  list.forEach(i=>{ const u=upd(i.id, month); if(u && (u.text||u.rag)){ updated++; counts[u.rag in counts ? u.rag : '']++; if(u.needsBoard) needs++; } else counts['']++; });
  const openB = S.barriers.filter(b=>b.base===base && b.status!=='resolved').length;
  const fb = S.feedback[base+'_'+month];
  return {total:list.length, updated, counts, needs, openB, fb: !!(fb && (fb.working||fb.focus||fb.actions))};
}

/* ---------- update text formatting ---------- */
function fmt(text){
  const lines=String(text||'').split('\n'); const out=[];
  for(let raw of lines){ const l=raw.replace(/\t/g,' ').trim(); if(!l) continue;
    const bare=l.replace(/[:：\s]+$/,'');
    const isHead = bare.length<=40 && (/^[A-Z0-9][A-Z0-9 &\/'()\-–]+$/.test(bare) || /^(completed|ongoing|forthcoming( activities)?|next steps?|in progress|issues?|barriers?|challenges|focus areas?|successes|feedback)$/i.test(bare)) && !/^[•\-–o]/.test(l);
    if(isHead){ let cls=''; if(/complet|done|deliver|success/i.test(bare)) cls='done'; else if(/forthcom|next|plan|ongoing|progress/i.test(bare)) cls='next'; else if(/issue|barrier|challenge|risk|concern/i.test(bare)) cls='issue'; out.push(`<span class="h ${cls}">${esc(bare)}</span>`); continue; }
    const m=l.match(/^(?:[•\-–▪■]|o\s|\d+[.)])\s*(.*)$/); const sub=/^\s{2,}/.test(raw) || /^o\s/.test(l);
    if(m){ out.push(`<p class="b ${sub?'l2':''}">${esc(m[1])}</p>`); continue; }
    out.push(`<p class="p">${esc(l)}</p>`);
  }
  return `<div class="ft">${out.join('')}</div>`;
}

/* ---------- render ---------- */
function renderMonths(){
  $('#months').innerHTML = MONTHS.map(m => {
    const future = m.k > nowMonth;
    return `<button class="mbtn ${m.k===S.month?'on':''} ${m.prior?'prior':''} ${future?'future':''}" data-m="${m.k}" role="tab" aria-selected="${m.k===S.month}" title="${m.prior?'FY26 close-out':''}">${m.l}${m.prior?' <span class="ro">FY26</span>':''}</button>`;
  }).join('');
}
function renderNav(){
  const tabs = [{k:'network', l:'Network'}].concat(BASES.map(b=>({k:b.code,l:b.code}))).concat([{k:'barriers',l:'Barriers',sep:true},{k:'manage',l:'Initiatives'}]);
  $('#nav').innerHTML = tabs.map(t => {
    let cnt='';
    if (t.k==='barriers'){ const n=S.barriers.filter(b=>b.status!=='resolved').length; if(n) cnt=`<span class="cnt hot">${n}</span>`; }
    return `<button class="tab ${S.view===t.k?'on':''} ${t.sep?'sep':''}" data-v="${t.k}">${t.l}${cnt}</button>`;
  }).join('');
}
function render(){
  const keep={}; let focusId=null, sel=null;
  document.querySelectorAll('#view textarea[id], #view input[id]').forEach(el=>{ if(el.value!==el.defaultValue) keep[el.id]=el.value; });
  const ae=document.activeElement; if(ae && ae.id && ae.closest && ae.closest('#view')){ focusId=ae.id; try{ sel=[ae.selectionStart,ae.selectionEnd]; }catch(e){} }
  renderMonths(); renderNav();
  const b = $('#banner');
  if (S.db === null && S.booted) { b.hidden=false; b.innerHTML = '<strong>Read-only preview.</strong> Couldn\'t reach the board\'s storage. Reload to try again.'; }
  else if (S.canWrite === false) { b.hidden=false; b.innerHTML = '<strong>View only.</strong> You can read every update, but your access level on this board doesn\'t allow editing. Ask the board owner for Contributor access.'; }
  else b.hidden=true;
  const v=$('#view');
  if (S.view==='network') v.innerHTML = renderNetwork();
  else if (S.view==='barriers') v.innerHTML = renderBarriers();
  else if (S.view==='manage') v.innerHTML = renderManage();
  else v.innerHTML = renderBase(S.view);
  Object.entries(keep).forEach(([id,val])=>{ const el=document.getElementById(id); if(el) el.value=val; });
  if(focusId){ const el=document.getElementById(focusId); if(el){ el.focus({preventScroll:true}); if(sel&&el.setSelectionRange){ try{ el.setSelectionRange(sel[0],sel[1]); }catch(e){} } } }
}

// First readable line of an update, without section labels or bullet marks, for the one-line list view.
function snippet(text){
  for(const raw of String(text||'').split('\n')){
    const l=raw.replace(/\t/g,' ').trim(); if(!l) continue;
    const bare=l.replace(/[:：\s]+$/,'');
    if(bare.length<=40 && /^[A-Z0-9][A-Z0-9 &\/'()\-–]+$/.test(bare)) continue;
    return l.replace(/^(?:[•\-–▪■]|o\s|\d+[.)])\s*/,'');
  }
  return '';
}
const statusCell = u => u && u.rag ? `<span class="chip ${u.rag}">${RAG[u.rag]}</span>`
  : u && u.text ? '<span class="nostat">No status</span>' : '<span class="nostat missing">Not updated</span>';
const num = (n, cls='') => n ? `<b class="${cls}">${n}</b>` : '<span class="zero">–</span>';
// Month-on-month: how far an initiative's status moved since last month. On track and
// complete count as the same level, so finishing something is never a "slip".
const RANK = {green:0, blue:0, amber:1, red:2};
function moved(initId){
  const pk=prevKey(S.month); if(!pk) return 0;
  const c=upd(initId), p=upd(initId,pk);
  if(!(c&&c.rag in RANK) || !(p&&p.rag in RANK)) return 0;
  return RANK[c.rag]-RANK[p.rag];
}
const trendMark = initId => { const m=moved(initId); if(!m) return ''; const p=upd(initId,prevKey(S.month));
  return `<span class="tr ${m>0?'down':'up'}" title="${RAG[p.rag]} in ${mlabel(prevKey(S.month))}">${m>0?'▼':'▲'}</span>`; };
// Change since last month, worded and coloured by whether a rise is good or bad.
const delta = (now, before, upIsBad) => { if(before==null) return ''; const d=now-before; if(!d) return `<span class="d same">same as ${mlabel(prevKey(S.month))}</span>`;
  const bad = upIsBad ? d>0 : d<0; return `<span class="d ${bad?'bad':'good'}">${d>0?'▲':'▼'} ${Math.abs(d)} vs ${mlabel(prevKey(S.month))}</span>`; };

function renderNetwork(){
  const pk = prevKey(S.month);
  const rows = BASES.map(b=>({b, st:baseStats(b.code), pst: pk ? baseStats(b.code, pk) : null}));
  const P = pk ? rows.reduce((a,{pst})=>{ a.green+=pst.counts.green+pst.counts.blue; a.red+=pst.counts.red; a.amber+=pst.counts.amber; a.needs+=pst.needs; return a; }, {green:0,red:0,amber:0,needs:0}) : null;
  const slipped = [];
  if(pk) BASES.forEach(b=>initsFor(b.code).forEach(i=>{ if(moved(i.id)>0) slipped.push({b:b.code, i, from:upd(i.id,pk).rag, to:upd(i.id).rag}); }));
  const T = rows.reduce((a,{st})=>{ a.total+=st.total; a.updated+=st.updated; a.red+=st.counts.red; a.amber+=st.counts.amber; a.green+=st.counts.green; a.blue+=st.counts.blue; a.needs+=st.needs; a.openB+=st.openB; a.fb+=st.fb?1:0; return a; }, {total:0,updated:0,red:0,amber:0,green:0,blue:0,needs:0,openB:0,fb:0});
  const needs = [];
  BASES.forEach(b=> initsFor(b.code).forEach(i=>{ const u=upd(i.id); if(u&&u.needsBoard) needs.push({b:b.code,i,u}); }));
  const net = S.feedback['NET_'+S.month] || {};
  const dis = S.canWrite===false ? 'disabled' : '';
  // Small "+1 / -1 since last month" beside a count in the table; a rise is bad for these columns.
  const chg = (n, before) => { if(before==null || n===before) return ''; const d=n-before; return `<sup class="d ${d>0?'bad':'good'}">${d>0?'+':'−'}${Math.abs(d)}</sup>`; };
  const kpi = (n,l,cls,sub,d='') => `<div class="kpi ${n&&cls?cls:''}"><div class="v">${n}${sub?`<small>${sub}</small>`:''}</div><div class="l">${l}</div>${d}</div>`;
  return `<div class="phead"><h2>Network <small>${mlabel(S.month)} · ${BASES.length} bases · ${T.total} initiatives</small></h2>
      <div class="actions"><details class="pop"><summary class="btn">Export</summary><div class="menu">
        <button id="xlsx">Excel workbook (.xlsx)</button><button id="pdfPack">Board pack (print or PDF)</button><button id="copyNet">Copy summary as text</button></div></details></div></div>
    <div class="kpis">
      ${kpi(T.updated,'Updates in','', ' / '+T.total, T.total-T.updated?`<span class="d bad">${T.total-T.updated} still to come</span>`:'<span class="d good">All in</span>')}
      ${kpi(T.green+T.blue,'On track or complete','', '', P?delta(T.green+T.blue,P.green,false):'')}
      ${kpi(T.amber,'At risk','warn','', P?delta(T.amber,P.amber,true):'')}

const kpiNum = v => { const m=String(v||'').replace(/,/g,'').match(/-?\d+(?:\.\d+)?/); return m ? parseFloat(m[0]) : null; };
function loadSeries(initId){
  if(S.series[initId]) return;
  S.series[initId]='loading';
  S.db.series(initId, MONTHS.map(m=>m.k)).then(r=>{ S.series[initId]=r; render(); }).catch(()=>{ S.series[initId]='error'; render(); });
}
// One small line of the KPI actuals recorded up to the selected month, with the values written out beside it.
function kpiTrend(i){
  if(!i.kpi && !(upd(i.id)||{}).kpiActual) return '';
  const ser=S.series[i.id];
  if(!ser){ setTimeout(()=>loadSeries(i.id)); return '<div class="trend ro">Loading KPI actuals…</div>'; }
  if(ser==='loading') return '<div class="trend ro">Loading KPI actuals…</div>';
  if(ser==='error') return '';
  const pk=prevKey(S.month);
  const pts = MONTHS.filter(m=>m.k<=S.month).map(m=>{
    const u = m.k===S.month ? upd(i.id) : m.k===pk ? upd(i.id,pk) : ser[m.k];
    return {k:m.k, l:m.l, raw:u&&u.kpiActual||'', v:kpiNum(u&&u.kpiActual)};
  }).filter(p=>p.raw);
  if(!pts.length) return `<div class="trend ro">No KPI actuals recorded yet. Add one with the ${mlabel(S.month)} update.</div>`;
  const nums=pts.filter(p=>p.v!=null);
  let svg='';
  if(nums.length){
    // Plotted across the whole financial year, so even one month has a place and the line grows as months are added.
    const W=340,H=100,L=8,R=58,T=12,B=22;
    const base=/^\s*-?\d+(?:\.\d+)?\s*%?\s*$/.test(i.baseline||'') ? kpiNum(i.baseline) : null;
    const vals=nums.map(p=>p.v).concat(base!=null?[base]:[]);
    let lo=Math.min(...vals), hi=Math.max(...vals); const pad=(hi-lo)*0.15 || Math.abs(hi)*0.1 || 1; lo-=pad; hi+=pad;
    const idx=k=>MONTHS.findIndex(m=>m.k===k);
    const x=k=>L+idx(k)*(W-L-R)/(MONTHS.length-1), y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
    const last=nums[nums.length-1];
    const line=nums.length>1 ? `<path d="${nums.map((p,n)=>`${n?'L':'M'}${x(p.k).toFixed(1)},${y(p.v).toFixed(1)}`).join('')}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : '';
    svg=`<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="KPI actuals by month, ${esc(MONTHS[0].l)} to ${esc(MONTHS[MONTHS.length-1].l)}">
      <line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" class="axis"/>
      ${MONTHS.map(m=>`<line x1="${x(m.k).toFixed(1)}" x2="${x(m.k).toFixed(1)}" y1="${H-B}" y2="${H-B+3}" class="axis"/>`).join('')}
      <text x="${L}" y="${H-5}" class="lbl">${esc(MONTHS[0].l)}</text><text x="${W-R}" y="${H-5}" class="lbl" text-anchor="end">${esc(MONTHS[MONTHS.length-1].l)}</text>
      ${base!=null?`<line x1="${L}" x2="${W-R}" y1="${y(base).toFixed(1)}" y2="${y(base).toFixed(1)}" class="ref"/><text x="${W-R+6}" y="${(y(base)+4).toFixed(1)}" class="lbl">S25 ${esc(i.baseline.trim())}</text>`:''}
      ${line}
      ${nums.map(p=>`<g><circle cx="${x(p.k).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="4" class="${p===last?'last':''}"/><circle cx="${x(p.k).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="11" class="hit"><title>${esc(p.l)}: ${esc(p.raw)}</title></circle></g>`).join('')}
      <text x="${(x(last.k)+8).toFixed(1)}" y="${(y(last.v)+4).toFixed(1)}" class="val">${esc(last.raw)}</text>
    </svg>`;
  }
  return `<div class="trend"><div class="trend-h">KPI actuals</div>${svg}<div class="trend-v">${pts.map(p=>`<span><em>${esc(p.l)}</em> ${esc(p.raw)}</span>`).join('')}</div></div>`;
}

const FILTERS = [
  {k:'all', l:'All', test:()=>true},
  {k:'missing', l:'Not updated', test:u=>!(u&&(u.text||u.rag))},
  {k:'red', l:'Off track', test:u=>u&&u.rag==='red'},
  {k:'amber', l:'At risk', test:u=>u&&u.rag==='amber'},
  {k:'board', l:'For the board', test:u=>u&&u.needsBoard},
];
// The base's initiatives after the active filter and search, which is also what "Expand all" acts on.
function baseList(base){
  const all = initsFor(base);
  const f = FILTERS.find(x=>x.k===S.filter) || FILTERS[0];
  const q = (S.q||'').trim().toLowerCase();
  const list = all.filter(i=>{ const u=upd(i.id); if(!f.test(u)) return false; if(!q) return true;
    return [i.focusArea,i.detail,i.kpi,i.group,u&&u.text,u&&u.barrier].some(x=>String(x||'').toLowerCase().includes(q)); });
  return {all, list, f};
}

      ${shut?'':g.items.map(item).join('')}</section>`; }).join('');

const daysOpen = x => Math.max(0, Math.floor((Date.now() - Date.parse(x.raisedAt || (x.month+'-01')))/86400000));
const byAge = (a,b) => (a.status==='resolved')-(b.status==='resolved') || Date.parse(a.raisedAt||a.month+'-01')-Date.parse(b.raisedAt||b.month+'-01');

      <div class="right"><button class="btn" id="mCancel">Cancel</button><button class="btn primary" id="mSave">Save update</button></div></div>`);
  const rm=$('#mRemove'); if(rm) rm.addEventListener('click',()=>{
    $('#mLeft').innerHTML=`<span style="color:var(--red);font-weight:700">Remove the ${mlabel(S.month)} update for this initiative?</span> <button type="button" class="btn sm primary" id="mRemoveYes" style="background:var(--dark-orange);border-color:var(--dark-orange)">Yes, remove</button> <button type="button" class="btn sm" id="mRemoveNo">Keep it</button>`;
    $('#mRemoveNo').addEventListener('click',()=>editUpdate(initId));
    $('#mRemoveYes').addEventListener('click',async()=>{
      if(!S.db){ toast('Not connected'); return; }
      try{ await S.db.doc('updates/'+id).delete(); if(S.barriers.some(b=>b.id===id)) await S.db.doc('barriers/'+id).delete(); delete S.series[initId]; toast('Update removed. It can be restored from History.'); closeModal(); }
      catch(e){ toast('Couldn\'t remove: '+(e&&e.message||'try again')); }
    });
  });
  let rag=u.rag||'';
  $('#ragpick').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; rag=b.dataset.rag; $('#ragpick').classList.remove('need'); $('#ragpick').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); });
  $('#uNeeds').addEventListener('change',e=>{ $('#barrierWrap').hidden=!e.target.checked; });
  const cp=$('#copyPrev'); if(cp) cp.addEventListener('click',()=>{ if(!$('#uText').value.trim()) $('#uText').value=p.text; });
  $('#mCancel').addEventListener('click',closeModal);
  const doSave = async (opts) => {
    const text=$('#uText').value.trim(); const needs=$('#uNeeds').checked; const barrier=needs?$('#uBarrier').value.trim():'';
    const doc={base:i.base, initiative:i.id, month:S.month, text, rag, kpiActual:$('#uKpiA').value.trim(), needsBoard:needs, barrier, updatedAt:new Date().toISOString(), updatedBy:S.uid||null};
    try { await S.db.doc('updates/'+id).set(doc, opts); }
    catch(e){
      if(e && e.status===409){ showConflict(e.current, e.currentByName); return; }
      toast('Couldn\'t save: '+(e&&e.message||'try again')); return;
    }
    toast('Update saved'); delete S.series[initId];
    if(needs && barrier){
      const ex=S.barriers.find(b=>b.id===id); const now=new Date().toISOString();
      await save(S.db.doc('barriers/'+id), {base:i.base, initiative:i.id, month:S.month, description:barrier, status:ex?ex.status:'open', owner:ex?ex.owner||'':'', action:ex?ex.action||'':'', raisedBy:ex?ex.raisedBy||null:(S.uid||null), raisedAt:ex?(ex.raisedAt||null):now, updatedAt:now});
    }
    closeModal();
  };
  // Someone saved this update while the window was open: show theirs, let the user choose.
  const showConflict = (cur, byName) => {
    const c=$('#conflict'); c.hidden=false;
    c.innerHTML=`<div class="conflict"><b>${byName?esc(byName):'Someone else'} ${cur?'saved':'removed'} this update${cur&&cur.updatedAt?' at '+fmtStamp(cur.updatedAt):''} while you were editing.</b>
      ${cur?`<details><summary>See their version</summary>${cur.rag?`<span class="chip ${cur.rag}">${RAG[cur.rag]}</span>`:''}${fmt(cur.text)}</details>`:'<p>They removed it.</p>'}
      <div class="row-btns"><button class="btn sm primary" id="keepMine">Save mine over theirs</button><button class="btn sm" id="useTheirs">Discard mine, keep theirs</button></div>
      <div class="hint">Whichever is replaced stays in History.</div></div>`;
    $('#keepMine').addEventListener('click',()=>doSave());
    $('#useTheirs').addEventListener('click',closeModal);
  };
  $('#mSave').addEventListener('click',()=>{
    if(!rag){ $('#ragpick').classList.add('need'); toast('Pick a status first'); return; }
    doSave(startEtag!==undefined ? {ifMatch:startEtag} : undefined);
  });
}

async function showHistory(initId){
  const i=S.inits.find(x=>x.id===initId); if(!i) return;
  const id=initId+'_'+S.month;
  openModal(`<div><h2>History · ${esc(i.focusArea||i.detail.split('\n')[0])}</h2><div class="ctx">${esc(i.base)} · ${mlabel(S.month)} update. A version is kept whenever someone else saves over it, or it's removed.</div></div>
    <div id="hist" class="hist"><div class="ro">Loading…</div></div>
    <div class="foot"><span></span><div class="right"><button class="btn" id="mCancel">Close</button></div></div>`);
  $('#mCancel').addEventListener('click',closeModal);
  let versions;
  try{ versions=await S.db.history('updates', id); }catch(e){ $('#hist').innerHTML='<div class="ro">Couldn\'t load the history. Try again.</div>'; return; }
  const cur=S.updates[id]; const canRestore=S.canWrite!==false;
  const card=(d,label,n)=>`<div class="hv"><div class="hv-h">${d.rag?`<span class="chip ${d.rag}">${RAG[d.rag]}</span>`:''}<span>${label}</span>${n!=null&&canRestore?`<button class="more" data-restore="${n}">Restore this version</button>`:''}</div>
    ${d.kpiActual?`<div class="ro">KPI actual: ${esc(d.kpiActual)}</div>`:''}${fmt(d.text)}${d.needsBoard&&d.barrier?`<div class="ro">Board ask: ${esc(d.barrier)}</div>`:''}</div>`;
  const out=[];
  if(cur) out.push(card(cur, `<b>Current</b> · saved ${fmtWhen(cur.updatedAt)}${cur.updatedBy&&S.names[cur.updatedBy]&&S.names[cur.updatedBy]!=='Someone'?' by '+esc(who(cur.updatedBy)):''}`, null));
  versions.forEach((v,n)=>out.push(card(v.data, `<b>${v.action==='delete'?'Removed':'Replaced'}</b> ${fmtStamp(v.replacedAt)} by ${esc(v.replacedBy||'someone')}`, n)));
  if(!versions.length) out.push('<div class="ro">No earlier versions yet.</div>');
  $('#hist').innerHTML=out.join('');
  $('#hist').addEventListener('click',async e=>{
    const r=e.target.closest('[data-restore]'); if(!r) return;
    const doc=Object.assign({}, versions[+r.dataset.restore].data, {updatedAt:new Date().toISOString(), updatedBy:S.uid||null});
    if(await save(S.db.doc('updates/'+id), doc, 'Version restored')){ delete S.series[initId]; closeModal(); }
  });
}

/* ---------- persistence ---------- */
async function save(ref, doc, msg){
  if(!S.db){ toast('Not connected; nothing saved'); return false; }
  try { await ref.set(doc); if(msg) toast(msg); return true; }
  catch(e){ if(e && e.code==='invalid_argument' && S.canWrite===null){ S.canWrite=false; render(); } toast('Couldn\'t save: '+(e&&e.message||'try again')); return false; }
}
// Board feedback and notes save themselves shortly after typing stops, and immediately
// when the viewer switches month or tab, so nothing typed in a meeting is lost.
let fbTimer=null, fbPending=null;
function queueFeedback(key, fields, stateId){
  fbPending={key, month:S.month, fields, stateId};
  clearTimeout(fbTimer); fbTimer=setTimeout(flushFeedback, 900);
  const el=document.getElementById(stateId); if(el) el.textContent='Saving…';
}
async function flushFeedback(){
  clearTimeout(fbTimer); const p=fbPending; fbPending=null; if(!p) return;
  const prev=S.feedback[p.key]||{};
  const doc=Object.assign({}, prev, p.fields, {key:p.key, month:p.month, updatedAt:new Date().toISOString(), updatedBy:S.uid||null});
  const ok=await save(S.db.doc('feedback/'+p.key), doc, null);
  const el=document.getElementById(p.stateId); if(el) el.textContent = ok ? 'Saved' : 'Not saved. Check your connection and keep typing to retry.';
}
const feedbackFields = () => ({base:S.view, working:$('#fbWorking').value.trim(), focus:$('#fbFocus').value.trim(), actions:$('#fbActions').value.trim()});
window.addEventListener('beforeunload', e=>{ if(fbPending){ flushFeedback(); e.preventDefault(); e.returnValue=''; } });
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushFeedback(); });
async function patchBarrier(id, field, value){
  const b=S.barriers.find(x=>x.id===id); if(!b) return;
  if(b[field]===value) return;
  const doc=Object.assign({}, b, {[field]:value, updatedAt:new Date().toISOString()}); delete doc.id;
  await save(S.db.doc('barriers/'+id), doc, null);
}

/* ---------- subscriptions ---------- */
function subscribeMonth(){
  if(!S.db) return;
  ['cur','prev'].forEach(k=>{ if(S.unsub[k]){ S.unsub[k](); delete S.unsub[k]; } });
  S.updates={}; S.prevUpdates={};
  const q=S.db.collection('updates').where('month','==',S.month);
  S.unsub.cur=q.onSnapshot(snap=>{ S.updates={}; snap.docs.forEach(d=>{ S.updates[d.id]=d.data(); S.etags['updates/'+d.id]=d.etag; }); collectNames(); render(); }, err=>console.warn('updates',err));
  const pk=prevKey(S.month);
  if(pk){ S.unsub.prev=S.db.collection('updates').where('month','==',pk).onSnapshot(snap=>{ S.prevUpdates={}; snap.docs.forEach(d=>{ S.prevUpdates[d.id]=d.data(); }); render(); }, err=>console.warn('prev',err)); }
}
let nameReq=0;
async function collectNames(){
  if(!S.user) return;
  const ids=new Set();
  Object.values(S.updates).forEach(u=>u.updatedBy&&ids.add(u.updatedBy));
  Object.values(S.feedback).forEach(u=>u.updatedBy&&ids.add(u.updatedBy));
  const need=[...ids].filter(id=>!(id in S.names)); if(!need.length) return;
  const my=++nameReq;
  try{ const ps=await S.user.profiles(need); if(my!==nameReq) return; let ch=false; need.forEach(id=>{ const p=ps&&ps[id]; S.names[id]=(p&&p.name)||'Someone'; ch=true; }); if(ch) render(); }catch(e){ need.forEach(id=>S.names[id]='Someone'); }
}

async function boot(){
  render();
  const [db,user] = await Promise.all([claude.use('db'), claude.use('user')]);
  S.db=db; S.user=user; S.booted=true;
  if(user){ try{ S.uid=await user.id(); }catch(e){} try{ S.canWrite=await user.can('data.write'); }catch(e){ S.canWrite=null; } }
  if(!db){ render(); return; }
  S.unsub.bases=db.collection('bases').onSnapshot(snap=>{
    let list=snap.docs.map(d=>Object.assign({code:d.id},d.data()));
    if(!list.length){ const codes=[...new Set(S.inits.map(i=>i.base))]; list=codes.map((c,n)=>({code:c,name:c,order:n+1,archived:false})); }
    setBases(list); if(!ALLBASES.some(b=>b.code===S.view) && !['network','barriers','manage'].includes(S.view)) S.view='network'; render();
  }, err=>console.warn('bases',err));
  S.unsub.inits=db.collection('initiatives').onSnapshot(snap=>{ S.inits=snap.docs.map(d=>Object.assign({id:d.id},d.data())); render(); }, err=>console.warn('inits',err));
  S.unsub.fb=db.collection('feedback').onSnapshot(snap=>{ S.feedback={}; snap.docs.forEach(d=>{ S.feedback[d.id]=d.data(); }); collectNames(); render(); }, err=>console.warn('fb',err));
  S.unsub.bar=db.collection('barriers').onSnapshot(snap=>{ S.barriers=snap.docs.map(d=>Object.assign({id:d.id},d.data())); render(); }, err=>console.warn('barriers',err));
  subscribeMonth();
}

/* ---------- copy as text ---------- */
function baseText(base){
  const b=BASES.find(x=>x.code===base); const lines=[`${base} · ${b.name} · BIG BOARD ${mlabel(S.month)}`,''];
  initsFor(base).forEach(i=>{ const u=upd(i.id)||{}; lines.push(`■ ${(i.focusArea||i.detail.split('\n')[0]).toUpperCase()} — ${RAG[u.rag||'']}${u.needsBoard?' — NEEDS THE BOARD':''}`); if(i.kpi) lines.push(`  KPI: ${i.kpi.replace(/\n/g,', ')}`); lines.push(u.text?u.text.split('\n').map(l=>'  '+l).join('\n'):'  (no update)'); if(u.needsBoard&&u.barrier) lines.push('  WHERE WE NEED THE BOARD: '+u.barrier); lines.push(''); });
  const fb=S.feedback[base+'_'+S.month]; if(fb&&(fb.working||fb.focus||fb.actions)){ lines.push('BOARD FEEDBACK'); if(fb.working) lines.push('What\'s working: '+fb.working); if(fb.focus) lines.push('Focus areas: '+fb.focus); if(fb.actions) lines.push('Board actions: '+fb.actions); }
  return lines.join('\n');
}
function networkText(){
  const lines=[`BIG BOARD · Network summary · ${mlabel(S.month)}`,''];
  BASES.forEach(b=>{ const st=baseStats(b.code); const c=st.counts; lines.push(`${b.code}: ${st.updated}/${st.total} updated · ${c.green} on track, ${c.amber} at risk, ${c.red} off track, ${c.blue} complete · ${st.needs} flagged for board · ${st.openB} open barriers`); });
  const net=S.feedback['NET_'+S.month]; if(net&&net.notes){ lines.push('','BOARD NOTES',net.notes); }
  return lines.join('\n');
}
async function copyText(t){ try{ await navigator.clipboard.writeText(t); toast('Copied'); }catch(e){ openModal(`<div><h2>Copy this text</h2></div><textarea style="min-height:300px" id="cpTa">${esc(t)}</textarea><div class="foot"><span></span><div class="right"><button class="btn" id="mCancel">Close</button></div></div>`); const ta=$('#cpTa'); ta.select(); $('#mCancel').addEventListener('click',closeModal); } }

/* ---------- exports ---------- */
const plain = t => String(t||'').replace(/\t/g,' ').trim();
function loadXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src='/vendor/xlsx-0.18.5.full.min.js';
    sc.onload=()=>res(window.XLSX); sc.onerror=()=>rej(new Error('Couldn\'t load the Excel exporter')); document.head.appendChild(sc); });

// The selected month as a workbook: network summary, every update, barriers and board feedback.
async function exportXlsx(){
  let X; try{ toast('Preparing workbook…'); X=await loadXlsx(); }catch(e){ toast(e.message); return; }
  const sheet=(rows, widths)=>{ const ws=X.utils.json_to_sheet(rows); ws['!cols']=widths.map(w=>({wch:w})); return ws; };
  const wb=X.utils.book_new();
  X.utils.book_append_sheet(wb, sheet(BASES.map(b=>{ const st=baseStats(b.code); return {Base:b.code, Name:b.name, Initiatives:st.total, Updated:st.updated, Missing:st.total-st.updated,
    'On track':st.counts.green, 'At risk':st.counts.amber, 'Off track':st.counts.red, Complete:st.counts.blue, 'For the board':st.needs, 'Open barriers':st.openB, 'Feedback given':st.fb?'Yes':'No'}; }),
    [6,22,11,9,9,9,8,9,9,13,13,14]), 'Summary');
  const ups=[]; BASES.forEach(b=>initsFor(b.code).forEach(i=>{ const u=upd(i.id)||{}; const m=moved(i.id);
    ups.push({Base:b.code, Group:i.group||'', 'Focus area':i.focusArea||'', Detail:plain(i.detail), KPI:plain(i.kpi), 'S25 baseline':plain(i.baseline),
      Status:u.rag?RAG[u.rag]:(u.text?'No status':'Not updated'), 'Since last month':m>0?'Worse':m<0?'Better':'', 'KPI actual':u.kpiActual||'',
      Update:plain(u.text), 'For the board':u.needsBoard?'Yes':'', 'Board ask':plain(u.barrier), 'Last saved':u.updatedAt?fmtWhen(u.updatedAt):''}); }));
  X.utils.book_append_sheet(wb, sheet(ups, [6,24,22,40,24,16,12,14,12,80,12,40,11]), 'Updates');
  X.utils.book_append_sheet(wb, sheet(S.barriers.slice().sort(byAge).map(x=>{ const i=S.inits.find(y=>y.id===x.initiative);
    return {Base:x.base, Initiative:i?(i.focusArea||i.detail.split('\n')[0]):'', Barrier:plain(x.description), Raised:mlabel(x.month), 'Days open':x.status==='resolved'?'':daysOpen(x),
      Status:BSTATUS[x.status]||x.status, Owner:x.owner||'', 'Board action':x.action||''}; }), [6,24,60,9,10,15,18,40]), 'Barriers');
  const fbRows=BASES.map(b=>{ const f=S.feedback[b.code+'_'+S.month]||{}; return {Base:b.code, "What's working":plain(f.working), 'Focus areas':plain(f.focus), 'Board actions':plain(f.actions)}; });
  const net=S.feedback['NET_'+S.month]; if(net&&net.notes) fbRows.push({Base:'Network', "What's working":plain(net.notes), 'Focus areas':'', 'Board actions':''});
  X.utils.book_append_sheet(wb, sheet(fbRows, [9,50,50,50]), 'Board feedback');
  X.writeFile(wb, `big-board-${S.month}.xlsx`);
}
// A print-ready pack of the month, one base per page. "Save as PDF" in the print dialog gives the PDF.
function printPack(){
  let el=document.getElementById('printPack'); if(!el){ el=document.createElement('div'); el.id='printPack'; document.body.appendChild(el); }
  const today=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  const sum=`<table class="pp-sum"><thead><tr><th>Base</th><th>Updated</th><th>On track</th><th>At risk</th><th>Off track</th><th>Complete</th><th>For board</th><th>Open barriers</th></tr></thead><tbody>
    ${BASES.map(b=>{ const st=baseStats(b.code); return `<tr><td><b>${b.code}</b> ${esc(b.name)}</td><td>${st.updated}/${st.total}</td><td>${st.counts.green}</td><td>${st.counts.amber}</td><td>${st.counts.red}</td><td>${st.counts.blue}</td><td>${st.needs}</td><td>${st.openB}</td></tr>`; }).join('')}</tbody></table>`;
  const net=S.feedback['NET_'+S.month];
  const bases=BASES.map(b=>{ const st=baseStats(b.code); const f=S.feedback[b.code+'_'+S.month]||{};
    return `<section class="pp-base"><h2>${b.code} · ${esc(b.name)}</h2><p class="pp-meta">${st.updated} of ${st.total} updated · ${st.counts.green} on track · ${st.counts.amber} at risk · ${st.counts.red} off track · ${st.counts.blue} complete${st.needs?` · ${st.needs} for the board`:''}</p>
      ${initsFor(b.code).map(i=>{ const u=upd(i.id)||{}; return `<div class="pp-it"><div class="pp-h"><b>${esc(i.focusArea||i.detail.split('\n')[0])}</b><span class="chip ${u.rag||'none'}">${u.rag?RAG[u.rag]:(u.text?'No status':'Not updated')}</span>${u.needsBoard?'<span class="chip board">For the board</span>':''}</div>
        ${i.kpi?`<div class="pp-kpi">KPI: ${esc(i.kpi.replace(/\n/g,', '))}${u.kpiActual?` · actual <b>${esc(u.kpiActual)}</b>`:''}${i.baseline?` · S25 ${esc(i.baseline.replace(/\n/g,', '))}`:''}</div>`:''}
        ${u.text?fmt(u.text):''}${u.needsBoard&&u.barrier?`<div class="barrier"><b>Where we need the board</b>${esc(u.barrier)}</div>`:''}</div>`; }).join('')}
      ${(f.working||f.focus||f.actions)?`<div class="pp-fb"><h3>Board feedback</h3>${f.working?`<p><b>What's working:</b> ${esc(f.working)}</p>`:''}${f.focus?`<p><b>Focus areas:</b> ${esc(f.focus)}</p>`:''}${f.actions?`<p><b>Board actions:</b> ${esc(f.actions)}</p>`:''}</div>`:''}
    </section>`; }).join('');
  el.innerHTML=`<header class="pp-cover"><h1>BIG BOARD · ${mlabel(S.month)}</h1><p>Focus initiatives board pack · generated ${today}</p>${sum}${net&&net.notes?`<h3>Board notes</h3><p style="white-space:pre-wrap">${esc(net.notes)}</p>`:''}</header>${bases}`;
  window.print();
}

/* ---------- events ---------- */
$('#months').addEventListener('click',e=>{ const b=e.target.closest('[data-m]'); if(!b) return; flushFeedback(); S.month=b.dataset.m; S.expanded={}; subscribeMonth(); render(); });
$('#nav').addEventListener('click',e=>{ const b=e.target.closest('[data-v]'); if(!b) return; flushFeedback(); if(S.view!==b.dataset.v){ S.filter='all'; S.q=''; } S.view=b.dataset.v; render(); window.scrollTo({top:0}); });
$('#view').addEventListener('click',async e=>{
  const t=e.target;
  const tg=t.closest('[data-toggle]'); if(tg){ S.open[tg.dataset.toggle]=!S.open[tg.dataset.toggle]; render(); return; }
  const cl=t.closest('[data-collapse]'); if(cl){ const k=cl.dataset.collapse; S.collapsed[k]=!S.collapsed[k]; render(); return; }
  const fl=t.closest('[data-filter]'); if(fl){ S.filter=fl.dataset.filter; if(fl.dataset.clearq) S.q=''; render(); return; }
  if(t.id==='toggleAll'){ const {list}=baseList(S.view); const allOpen=list.every(i=>S.open[i.id]); list.forEach(i=>{ S.open[i.id]=!allOpen; }); render(); return; }
  const go=t.closest('[data-go]'); if(go && !t.closest('textarea')){ flushFeedback(); S.view=go.dataset.go; S.filter=go.dataset.f||'all'; S.q=''; render(); window.scrollTo({top:0}); return; }
  if(t.id==='copyBase'){ copyText(baseText(t.dataset.base)); return; }
  if(t.id==='addBase'){ addBase(); return; }
  if(t.dataset.archbase){ archiveBase(t.dataset.archbase); return; }
  if(t.dataset.restorebase){ restoreBase(t.dataset.restorebase); return; }
  if(t.id==='copyNet'){ copyText(networkText()); return; }
  if(t.dataset.more){ S.expanded[t.dataset.more]=true; render(); return; }
  if(t.dataset.edit){ editUpdate(t.dataset.edit); return; }
  if(t.dataset.history){ showHistory(t.dataset.history); return; }
  if(t.id==='xlsx'){ exportXlsx(); return; }
  if(t.id==='pdfPack'){ printPack(); return; }
  if(t.dataset.newbarrier!==undefined){ newBarrier(t.dataset.newbarrier||(BASES.some(b=>b.code===S.view)?S.view:(BASES[0]||{}).code)); return; }
  if(t.dataset.newinit!==undefined){ editInit(null); return; }
  if(t.dataset.editinit){ editInit(t.dataset.editinit); return; }
  if(t.dataset.arch){ const i=S.inits.find(x=>x.id===t.dataset.arch); if(i){ const d=Object.assign({},i,{archived:!i.archived}); await save(S.db.doc('initiatives/'+i.id), d, d.archived?'Archived':'Restored'); } return; }
});
$('#view').addEventListener('keydown',e=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const t=e.target;
  if(t.dataset.toggle){ e.preventDefault(); S.open[t.dataset.toggle]=!S.open[t.dataset.toggle]; render(); return; }
  if(t.matches('tr[data-go]')){ e.preventDefault(); S.view=t.dataset.go; S.filter='all'; S.q=''; render(); }
});
$('#view').addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='bq'){ S.q=e.target.value; render(); return; }
  if(id==='fbWorking'||id==='fbFocus'||id==='fbActions') queueFeedback(S.view+'_'+S.month, feedbackFields(), 'fbState');
  if(id==='netNotes') queueFeedback('NET_'+S.month, {base:'NET', notes:e.target.value.trim()}, 'netState');
});
$('#view').addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='bfBase'||t.id==='bfStatus'){ S.bfilter={base:$('#bfBase').value, status:$('#bfStatus').value}; render(); return; }
  if(t.dataset.bf){ const tr=t.closest('tr'); patchBarrier(tr.dataset.bid, t.dataset.bf, t.value.trim?t.value.trim():t.value); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
document.addEventListener('click',e=>{ document.querySelectorAll('details.pop[open]').forEach(d=>{ if(!d.contains(e.target) || e.target.closest('.menu')) d.open=false; }); });
$('#modalRoot').addEventListener('click',e=>{ if(e.target.id==='overlay') closeModal(); });

if(window.claude && typeof window.claude.use==='function') boot(); else { S.booted=true; render(); }
})();
</script>

</body>
</html>
